name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Bauen und Deployen in getrennten Jobs: Im selben Job findet deploy-pages
  # das eben hochgeladene Artefakt manchmal noch nicht (actions/deploy-pages#451).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp

      - name: Build site (src + generated icons)
        run: |
          mkdir -p _site
          cp -r src/. _site/
          sh docker/make-icons.sh _site/assets/icons

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
